name: Deploy Server to Railway

on:
  push:
    branches:
      - deploy
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy-server:
    name: Deploy NestJS Backend to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Server Service
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "Deploying via Railway CLI..."
            npm install -g @railway/cli
            cd server
            railway up --service ${{ secrets.RAILWAY_SERVER_SERVICE_NAME || 'server' }} --detach
          elif [ -n "${{ secrets.RAILWAY_SERVER_DEPLOY_HOOK }}" ]; then
            echo "Deploying via Railway Webhook Trigger..."
            curl -X POST "${{ secrets.RAILWAY_SERVER_DEPLOY_HOOK }}"
          else
            echo "Notice: Neither RAILWAY_TOKEN nor RAILWAY_SERVER_DEPLOY_HOOK configured. Railway Git Auto-Deploy handles deployment automatically."
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

