name: Deploy Keycloak to Railway

on:
  push:
    branches:
      - deploy
    paths:
      - 'keycloak/**'
      - '.github/workflows/deploy-keycloak.yml'
  workflow_dispatch:

jobs:
  deploy-keycloak:
    name: Deploy Keycloak Service to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Keycloak Service
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "Deploying via Railway CLI..."
            npm install -g @railway/cli
            cd keycloak
            railway up --service ${{ secrets.RAILWAY_KEYCLOAK_SERVICE_NAME || 'keycloak' }} --detach
          elif [ -n "${{ secrets.RAILWAY_KEYCLOAK_DEPLOY_HOOK }}" ]; then
            echo "Deploying via Railway Webhook Trigger..."
            curl -X POST "${{ secrets.RAILWAY_KEYCLOAK_DEPLOY_HOOK }}"
          else
            echo "Notice: Neither RAILWAY_TOKEN nor RAILWAY_KEYCLOAK_DEPLOY_HOOK configured. Railway Git Auto-Deploy handles deployment automatically."
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

